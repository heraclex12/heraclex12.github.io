<header class="intro">
  <div class="intro__content">
    <div class="intro__left">
      <h1 class="intro__name">
        Hieu Tran
        <span class="emoji wave-hand animated"></span>
      </h1>
      <p class="intro__title">CS PhD Student at University of Maryland</p>
    </div>
    <div class="intro__right">
      <div class="intro__contact-row">
        <span class="intro__contact-label">
          <span>Get in touch </span>
          <span class="emoji pointer"></span>
        </span>
        <a href="mailto:heraclex12@gmail.com" target="_blank" class="intro__email-button">heraclex12@gmail.com</a>
      </div>
      <div class="intro__social">
        {% for link in site.social %}
          {% if link.title != "email" %}
            <a href="{{link.url}}" target="_blank" title="{{link.title}}" class="intro__social-link">
              <img src="{{site.baseurl}}/img/social/{{link.title}}.svg" alt="{{link.title}}">
            </a>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </div>
</header>
